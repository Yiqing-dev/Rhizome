<!doctype html>
<html><head><meta charset="utf-8"><title>Rhizome</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:"Segoe UI",system-ui,"Microsoft YaHei UI",sans-serif;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;height:100vh;margin:0;color:#6b6f66;background:#f5f3ec}
  @media (prefers-color-scheme:dark){body{background:#15170f;color:#9a9e91}}
  .dot{width:10px;height:10px;border-radius:50%;background:#5e9a1b;display:inline-block;margin:0 4px;animation:p 1.2s infinite ease-in-out}
  .dot:nth-child(2){animation-delay:.15s;background:#4a68e6}.dot:nth-child(3){animation-delay:.3s;background:#d2650b}
  @keyframes p{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
</style></head>
<body><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<p>正在启动 Rhizome… · Starting Rhizome…</p>
<small id="late" hidden style="max-width:560px;text-align:center;line-height:1.6">
  如果一直停在这里，请关闭后重新打开；日志在 %LOCALAPPDATA%\dev.rhizome.desktop\logs（backend-console.log、shell.log）。<br>
  If it stays here, close and reopen Rhizome; logs are in %LOCALAPPDATA%\dev.rhizome.desktop\logs (backend-console.log, shell.log).
</small>
<script>setTimeout(function () { var e = document.getElementById("late"); if (e) e.hidden = false; }, 180000);</script>
</body></html>

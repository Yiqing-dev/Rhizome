[package]
name = "rhizome-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rhizome desktop shell (Tauri) around the Python sidecar"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
regex = "1"

[profile.release]
strip = true
lto = true

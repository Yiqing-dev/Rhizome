[package]
name = "rhizome-desktop"
version = "0.1.7"
edition = "2021"
license = "Apache-2.0"
description = "Rhizome desktop shell (Tauri) around the bundled Python backend"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
getrandom = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1

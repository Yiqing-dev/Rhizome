<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Rhizome</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f5f3ee'/%3E%3Crect x='5' y='5' width='10' height='10' fill='%23ec3013'/%3E%3Crect x='17' y='5' width='10' height='10' fill='%231a1a1a'/%3E%3Crect x='5' y='17' width='10' height='10' fill='%231a1a1a'/%3E%3Crect x='17' y='17' width='10' height='10' fill='%231a1a1a'/%3E%3C/svg%3E" />
    <style>
      /* the page background before the bundle arrives: no white flash in dark mode */
      html { background: #f5f3ec; }
      html[data-theme="dark"] { background: #15170f; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #15170f; } }
    </style>
    <script>
      // appearance remembered from the last visit, applied before the first paint
      try {
        var t = localStorage.getItem("rhizome.theme"), a = localStorage.getItem("rhizome.accent");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (a) document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

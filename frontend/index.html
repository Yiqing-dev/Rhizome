<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Rhizome</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%235e9a1b'/%3E%3Cpath d='M16 10 L9 4 M16 22 L22 28 M10 16 L3 18 M22 16 L29 13' stroke='%235e9a1b' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='4' r='2.6' fill='%234a68e6'/%3E%3Ccircle cx='22' cy='28' r='2.6' fill='%23d2650b'/%3E%3Ccircle cx='3' cy='18' r='2.6' fill='%237466b8'/%3E%3Ccircle cx='29' cy='13' r='2.6' fill='%23178f6c'/%3E%3C/svg%3E" />
    <style>
      /* the page background before the bundle arrives: no white flash in dark mode */
      html { background: #f5f3ec; }
      html[data-theme="dark"] { background: #15170f; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #15170f; } }
    </style>
    <script>
      // appearance remembered from the last visit, applied before the first paint
      try {
        var t = localStorage.getItem("rhizome.theme"), a = localStorage.getItem("rhizome.accent");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (a) document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

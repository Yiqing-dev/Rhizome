[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhizome"
version = "0.1.3"
description = "Personal literature asset graph: papers split into reusable datasets, methods, ideas and claims."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Yiqing Wang" }]
dependencies = [
  # Upper bounds at the next major: a new major (e.g. mcp 2, which renamed FastMCP) must be adopted
  # deliberately, not picked up by a fresh install.
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.21,<5",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "watchdog>=4.0,<7",
  "numpy>=1.26,<3",
  "babel>=2.14,<3",
  "fsrs>=5.0,<7",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
# Local judgement models (downloaded on demand, never bundled).
models = ["sentence-transformers>=3.2", "onnxruntime>=1.17", "transformers>=4.40", "huggingface_hub>=0.23"]
llm = ["llama-cpp-python>=0.2.80"]
graph = ["graspologic>=3.4"]
# psycopg is LGPL-3.0 (compatible with Apache-2.0 distribution as a dynamically used library).
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
keyring = ["keyring>=24"]
# ruff is pinned: a new release adds rules, and lint must not turn red without a code change.
dev = ["pytest>=8", "pip-licenses>=4.4", "ruff==0.15.20"]

[project.scripts]
rhz = "rhizome.cli:run"
rhizome-mcp = "rhizome.mcp_server:main"

[tool.setuptools.packages.find]
include = ["rhizome*"]

[tool.setuptools.package-data]
rhizome = ["web/*", "web/assets/*", "data/*", "i18n/locales/*/LC_MESSAGES/*.po", "migrations/*", "migrations/versions/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

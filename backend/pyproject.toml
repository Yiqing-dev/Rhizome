[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhizome"
version = "0.1.0"
description = "Personal literature asset graph: papers split into reusable datasets, methods, ideas and claims."
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Yiqing Wang" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "typer>=0.12",
  "watchdog>=4.0",
  "numpy>=1.26",
  "babel>=2.14",
  "fsrs>=5.0",
  "mcp>=1.2",
]

[project.optional-dependencies]
# Local judgement models (downloaded on demand, never bundled).
models = ["sentence-transformers>=3.2", "onnxruntime>=1.17", "transformers>=4.40", "huggingface_hub>=0.23"]
llm = ["llama-cpp-python>=0.2.80"]
graph = ["graspologic>=3.4"]
# psycopg is LGPL-3.0 (compatible with Apache-2.0 distribution as a dynamically used library).
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
keyring = ["keyring>=24"]
dev = ["pytest>=8", "pip-licenses>=4.4", "ruff>=0.4"]

[project.scripts]
rhz = "rhizome.cli:app"
rhizome-mcp = "rhizome.mcp_server:main"

[tool.setuptools.packages.find]
include = ["rhizome*"]

[tool.setuptools.package-data]
rhizome = ["data/*", "i18n/locales/*/LC_MESSAGES/*.po", "migrations/*", "migrations/versions/*", "rxf/schemas/*.json", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
